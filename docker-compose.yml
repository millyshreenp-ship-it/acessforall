services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: afa, POSTGRES_PASSWORD: afa, POSTGRES_DB: afa}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afa"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: [media:/data/media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    command: celery -A app.worker.celery worker -l info -c 2
    env_file: .env
    volumes: [media:/data/media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  pgdata:
  media:
